name: ci - alpine-release

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

jobs:
  release:
    runs-on: ubuntu-24.04-arm

    name: "Publish release qbt-hosts-deps"

    env:
      qbt_build_dir: "qbt-build"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Host - Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: "release"
          merge-multiple: true

      - name: Host- Create release - tag - assets
        env:
          GH_TOKEN: "${{ github.TOKEN }}"
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.release_tag }}" >/dev/null 2>&1; then
            gh release edit "${{ inputs.release_tag }}" \
              --title "${{ inputs.release_tag }}" \
              --notes-file release.md \
              --latest \
            gh release upload "${{ inputs.release_tag }}" \
              --clobber \
              "release/*.tar.xz"
          else
            gh release create "${{ inputs.release_tag }}" \
              --title "${{ inputs.release_tag }}" \
              --notes-file release.md \
              --latest \
              "release/*.tar.xz"
          fi
