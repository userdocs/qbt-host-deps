name: ci - alpine-release

on:
  workflow_call:
    inputs:
      distinct_id:
        description: "Distinct ID for the artifacts"
        required: true
        type: string
      release_tag:
        type: string
        required: true

jobs:
  release:
    runs-on: ubuntu-24.04-arm

    name: "Publish release qbt-hosts-deps"

    env:
      qbt_build_dir: "qbt-build"

    steps:
      - name: Checkout ${{ inputs.distinct_id }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Host - Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: "release"
          merge-multiple: true

      - name: Host- Create release - tag - assets
        uses: ncipollo/release-action@bcfe5470707e8832e12347755757cec0eb3c22af # v1
        with:
          artifacts: "release/*.tar.xz"
          replacesArtifacts: true
          tag: "${{ inputs.release_tag }}"
          name: "${{ inputs.release_tag }}"
          allowUpdates: true
          token: "${{ github.token }}"
